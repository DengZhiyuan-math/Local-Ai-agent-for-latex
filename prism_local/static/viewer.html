<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF · prism-local</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { background: var(--pdf-bg); }
  #pdf-pane.full { width: auto; flex: 1; min-width: 0; height: 100vh; }
  #viewer-note { color: var(--muted); font-size: 11px; margin-left: 10px; white-space: nowrap; }
  #viewer-note.warn { color: var(--warn); }
</style>
</head>
<body>
<section id="pdf-pane" class="full">
  <div id="pdf-toolbar">
    <button id="zoom-out" class="icon" data-icon="minus" title="Zoom out" aria-label="Zoom out"></button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" class="icon" data-icon="plus" title="Zoom in" aria-label="Zoom in"></button>
    <button id="zoom-fit" title="Fit width">Fit</button>
    <span id="viewer-note">Double-click (or Ctrl-click) to jump to the source in the editor tab</span>
    <span id="page-label"></span>
    <a class="btn" id="pdf-raw" href="/pdf" target="_blank" data-icon="download" title="Open the PDF in the browser's own viewer, to print or download it">Raw PDF</a>
  </div>
  <div id="pdf-scroll"><div id="pdf-pages"></div><div id="pdf-empty">No PDF yet — compile in the editor.</div></div>
</section>
<script src="/static/vendor/pdf.js"></script>
<script src="/static/common.js"></script>
<script src="/static/pdfview.js"></script>
<script src="/static/viewer.js"></script>
</body>
</html>
