name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
        python: ['3.9', '3.14']
        shard: [1, 2]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install test compatibility dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Check HTTP fixture startup
        timeout-minutes: 2
        run: python tests/run_ci.py --output-dir .ci-results/startup --modules test_research_http.ResearchHTTP.test_empty_project_without_supplied_question_or_notation_is_valid
      - name: Check Windows portability
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: >-
          python tests/run_ci.py --output-dir .ci-results/compatibility --modules
          test_build_results.Results.test_system_distribution_inputs_are_historical_environment
          test_codex_discovery.CodexDiscovery.test_one_disappearing_bundle_does_not_hide_another_installation
          test_deepcode_shared.DeepCodeMetadata.test_strict_nofollow_metadata_reads_regular_json_but_refuses_links
          test_install_sh
          test_research.Baseline.test_multidocument_baseline_keeps_versions_locations_and_source_text
          test_research_incremental.IncrementalKnowledge.test_omitted_original_macro_is_added_from_its_initialization_version
          test_research_save_coordination.SourceCoordinationSchedule
          test_research_save_coordination.APISourceCoordinationHTTP.test_stale_whole_file_write_keeps_an_external_save
          test_gitsync_provenance_http.GitSyncProvenanceHTTP.test_active_real_turn_defers_tick_and_manual_pull_until_the_turn_ends
          test_gitsync_provenance_http.GitSyncProvenanceHTTP.test_disabled_sync_stays_disabled_and_existing_schedule_resumes_after_explicit_enable
          test_gitsync_provenance_http.GitSyncProvenanceHTTP.test_library_only_received_name_gets_an_on_demand_source_question_before_reuse
          test_github_approvals_http.GitHubApprovalsHTTP.test_fresh_named_rejection_revokes_a_published_approval_without_replaying_old_comments
      - name: Run offline fixture suite
        run: python tests/run_ci.py --native-app-fixtures --shard ${{ matrix.shard }}/2
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}-shard-${{ matrix.shard }}
          path: .ci-results/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload startup report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: startup-${{ matrix.os }}-python-${{ matrix.python }}-shard-${{ matrix.shard }}
          path: .ci-results/startup/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows portability report
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-${{ matrix.os }}-python-${{ matrix.python }}-shard-${{ matrix.shard }}
          path: .ci-results/compatibility/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
