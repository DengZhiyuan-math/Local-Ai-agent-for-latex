name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
        python: ['3.9', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install test compatibility dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Check HTTP fixture startup
        timeout-minutes: 2
        run: python tests/run_ci.py --output-dir .ci-results/startup --modules test_research_http.ResearchHTTP.test_empty_project_without_supplied_question_or_notation_is_valid
      - name: Run offline fixture suite
        run: python tests/run_ci.py --native-app-fixtures
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: .ci-results/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload startup report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: startup-${{ matrix.os }}-python-${{ matrix.python }}
          path: .ci-results/startup/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
